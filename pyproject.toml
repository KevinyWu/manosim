[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manosim"
version = "0.1.0"
description = "MANO hand models in MJCF format for MuJoCo simulation."
requires-python = ">=3.10"

[tool.setuptools]
packages = [
    "manosim",
]

[tool.setuptools.package-dir]
manosim = "src"
